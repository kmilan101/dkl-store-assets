name: Build, safety test, publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (fails on JS errors, size budgets, Payhip box limits)
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Safety test (new build vs published build on saved store pages, desktop + mobile)
        run: npm test
      - name: Keep screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-test-${{ github.run_number }}
          path: test-results
          retention-days: 14
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "publish ${{ github.sha }}"
      - name: Refresh the mirror copy (jsDelivr)
        run: |
          for f in store.css head.css head.js foot.css foot.js; do
            curl -s -o /dev/null -w "$f %{http_code}\n" "https://purge.jsdelivr.net/gh/kmilan101/dkl-store-assets@gh-pages/$f" || true
          done
